<main class="contact-page">
  <div class="shell contact-grid">

      <p class="eyebrow">Let’s connect</p>

      <p class="lede">For social-services opportunities, community work, writing, collaboration, or IT support, complete the form and your message will come directly to me.</p>

      <form action="https://api.web3forms.com/submit" method="POST">
        <input type="hidden" name="access_key" value="98a6fb52-6272-4535-ba6d-4e19b7448435">
        <input type="hidden" name="subject" value="New portfolio message">
        <input type="hidden" name="from_name" value="Adekunle Omonihi Portfolio">
        <input type="checkbox" name="botcheck" class="botcheck" tabindex="-1" autocomplete="off">

        <div class="form-row">
          <div class="field">

            <input type="text" id="name" name="name" autocomplete="name" required>

            <input type="email" id="email" name="email" autocomplete="email" required>

        <div class="field">

          <textarea id="message" name="message" rows="6" required></textarea>
